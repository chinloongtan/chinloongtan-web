he basics of Rust programming, I decided to rewrite the minimax algorithm, which I had previously implemented in Ruby, in Rust.\n\nGitHub Repository: [https://github.com/chinloongtan/unbeatable-tictactoe-wasm](https://github.com/chinloongtan/unbeatable-tictactoe-wasm)\n\n---\n\n#### Exploring Wasm (WebAssembly)\n\nI thought, why stop at a binary executable when I could compile it as a library crate? So I took it a step further and compiled it into a WebAssembly (Wasm) package to use on the web.\n\n---\n\nRust is both fast and safe, and I’m excited to spend more time working with it.\n\nThat's all for now. Thanks for reading.\n","fullPath":"/Users/chinloong/makespace/chinloongtan-web/src/content/blog/2025/01/19-unbeatable-tictactoe-with-rust/index.md","timeToRead":1}],"totalCount":1,"tag":"rust"},"__N_SSG":true},"page":"/tags/[tag]","query":{"tag":"rust"},"buildId":"5_5qDiyMKJ8eEUVw5aJpV","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
