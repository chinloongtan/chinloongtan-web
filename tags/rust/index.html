t-white hover:text-cyan-400" href="/">TAGS/rust</a></div></div></div></nav><div class="py-4 px-6 md:px-16 lg:px-32 text-grey"><b class="text-black">2</b> post<!-- -->s<!-- --> tagged with<!-- --> <b class="text-black">&quot;<!-- -->rust<!-- -->&quot;</b><br/><a class="text-primaryBlue font-medium" href="/tags/">View all tags</a></div><div class="px-4 md:px-16 lg:px-32"><div class="blog-post-preview"><a style="color:black" class="blog-post-preview-link" href="/blog/unbeatable-tictactoe-with-rust/"><h4 class="font-bold text-xl">Unbeatable TicTacToe with Rust</h4><h6 class="text-md" style="color:#576366">19 January 2025</h6><div class="text-base mt-2"><span style="color:#576366">Minimax algorithm</span><span class="text-sm block md:float-right">1<!-- --> min read</span></div></a><div style="flex-direction:row;display:flex;margin-top:10px;font-size:14px;flex-wrap:wrap"><a style="margin-right:10px;background-color:rgba(255, 165, 0, 0.3);padding:5px;padding-left:8px;padding-right:8px;border-radius:6px;font-family:Raleway;text-decoration:none;color:#ffa500" class="font-medium" href="/tags/rust/">rust<!-- --> </a></div></div></div><div class="px-4 md:px-16 lg:px-32"><div class="blog-post-preview"><a style="color:black" class="blog-post-preview-link" href="/blog/api-architecture-sub-70ms-response-times/"><h4 class="font-bold text-xl">Building a lightning-fast sub-70ms MVP API</h4><h6 class="text-md" style="color:#576366">13 August 2025</h6><div class="text-base mt-2"><span style="color:#576366">Solo developer building a high-performance fresh produce delivery MVP with Rust and Axum</span><span class="text-sm block md:float-right">3<!-- --> min read</span></div></a><div style="flex-direction:row;display:flex;margin-top:10px;font-size:14px;flex-wrap:wrap"><a style="margin-right:10px;background-color:rgba(255, 165, 0, 0.3);padding:5px;padding-left:8px;padding-right:8px;border-radius:6px;font-family:Raleway;text-decoration:none;color:#ffa500" class="font-medium" href="/tags/rust/">rust<!-- --> </a></div></div></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"posts":[{"slug":"unbeatable-tictactoe-with-rust","frontmatter":{"path":"/blog/unbeatable-tictactoe-with-rust","date":"2025-01-19T13:21:01.000Z","title":"Unbeatable TicTacToe with Rust","excerpt":"Minimax algorithm","tags":["rust"]},"content":"\nIt's 2025, and I've written my first Rust program!\n\nCheck it out here: [https://tictactoe.chinloongtan.com/](https://tictactoe.chinloongtan.com/)\n\n---\n\nI've always wanted to learn a new programming language to gain fresh perspectives and explore new programming paradigms.\n\nRust introduces a few exciting concepts, such as ownership and borrowing, and eliminates null values, making it safer and more reliable.\n\nAfter learning the basics of Rust programming, I decided to rewrite the minimax algorithm, which I had previously implemented in Ruby, in Rust.\n\nGitHub Repository: [https://github.com/chinloongtan/unbeatable-tictactoe-wasm](https://github.com/chinloongtan/unbeatable-tictactoe-wasm)\n\n---\n\n#### Exploring Wasm (WebAssembly)\n\nI thought, why stop at a binary executable when I could compile it as a library crate? So I took it a step further and compiled it into a WebAssembly (Wasm) package to use on the web.\n\n---\n\nRust is both fast and safe, and I’m excited to spend more time working with it.\n\nThat's all for now. Thanks for reading.\n","fullPath":"/Users/chinloong/makespace/chinloongtan-web/src/content/blog/2025/01/19-unbeatable-tictactoe-with-rust/index.md","timeToRead":1},{"slug":"api-architecture-sub-70ms-response-times","frontmatter":{"path":"/blog/api-architecture-sub-70ms-response-times","date":"2025-08-13T10:00:00.000Z","title":"Building a lightning-fast sub-70ms MVP API","excerpt":"Solo developer building a high-performance fresh produce delivery MVP with Rust and Axum","tags":["rust"]},"content":"\nWhen I set out to build a fresh produce delivery MVP from scratch, performance wasn't just a nice-to-have — it was mission-critical. The platform needed to handle real-time inventory updates, order processing, and multi-tenant shop management with lightning-fast response times.\n\nHere's how I achieved sub-70ms response times in staging and what I'm expecting when production traffic hits.\n\n---\n\n## The Tech Stack Behind the Speed\n\n### Rust + Axum: The Performance Foundation\n\nI chose Rust with Axum 0.8.3 as my core framework, and it's already paying dividends. Rust compiles to native machine code with zero-cost abstractions — meaning I get C-level performance without sacrificing developer productivity. My codebase uses async functions, ensuring every I/O operation is non-blocking.\n\nAxum runs on the Tokio async runtime, giving me true concurrent request handling. While other frameworks interpret bytecode or manage garbage collection, Rust API runs as optimized native code from day one.\n\n### Database Layer: Engineered for Speed\n\nMy PostgreSQL setup with SQLx is where the real magic happens:\n\n- **Type-safe queries**: All database queries are validated at compile time, eliminating runtime parsing overhead\n\u003c!-- - **Optimized connection pooling**: 20 max connections, 5 minimum baseline, with intelligent connection management\n- **Smart timeouts**: 2-minute idle timeout, 30-minute max lifetime, 5-second acquire timeout for fail-fast behavior --\u003e\n- **Health checks**: Every connection is tested before use, preventing failed requests\n\nThe connection pool includes exponential backoff retry logic, so even during database hiccups, the app maintain performance and reliability.\n\n---\n\n## Architecture Designed for Scale\n\nMy modular architecture separates concerns across 9 core modules:\n- Authentication \u0026 user management\n- Multi-tenant shop system\n- Real-time inventory tracking\n- Order processing \u0026 fulfillment\n- File management with Google Cloud Storage\n\nEach module follows a clean controller → service → model pattern, with compile-time verified SQL queries ensuring zero runtime surprises.\n\n---\n\n## Security Without Performance Compromise\n\nAuthentication uses JWT tokens with industry standard encryption, supporting both Bearer tokens and secure HTTP-only cookies. My custom middleware handles auth guards and request logging without adding measurable latency.\n\nCORS is properly configured for cross-origin requests with credential support, essential for my multi-domain setup.\n\n---\n\n## Development \u0026 Deployment Optimizations\n\nMy development workflow is built for speed:\n\n- **Hot reload** with cargo watch for instant feedback during development\n- **One-command deployment**: just deploy handles git pull, compilation, migrations, and service restart\n- **Comprehensive testing** covering authentication, inventory, orders, and shop management\n- **Zero-downtime migrations** using SQLx migrate\n\nThe staging environment runs on systemd with automatic service management.\n\n---\n\n## What I am Seeing in Staging\n\nCurrent performance metrics show:\n- **~70ms average response times** across most endpoints\n- **Zero connection pool exhaustion** under current load testing\n- **Consistent memory usage** with no garbage collection pauses\n\n![Screenshot](screenshot-postman.png)\n\n---\n\n## Production Traffic Expectations\n\nBased on my architecture choices, here's what I expect when real traffic arrives:\n\n### Advantages I'll maintain:\n- Native code performance won't degrade with load\n- Connection pooling will efficiently handle concurrent requests\n- Async/await design scales naturally with request volume\n- Type-safe queries eliminate a whole class of runtime errors\n\n### Areas I'm monitoring:\n- Database connection scaling (currently configured for moderate load)\n- Google Cloud Storage integration under high file upload volumes\n- JWT validation performance with increased authentication requests\n\n### My scaling plan:\n- **Horizontal scaling**: My stateless design makes adding instances trivial\n- **Database optimization**: Query analysis and indexing based on real usage patterns\n- **Connection pool tuning**: Adjusting pool size based on actual concurrent load\n- **CDN integration**: Offloading static assets and API caching where appropriate\n\n---\n\n## The Rust Advantage in Production\n\nRust's compile-time guarantees mean my staging performance translates directly to production — no surprises, no performance regressions from runtime optimizations failing under load.\n\nThe combination of zero-cost abstractions, efficient memory management, and Axum's lightweight design gives me confidence that fast response times will hold steady as traffic scales.\n\n\nThanks for reading. Cheers.\n","fullPath":"/Users/chinloong/makespace/chinloongtan-web/src/content/blog/2025/08/13-api-architecture-sub-70ms-response-times/index.md","timeToRead":3}],"totalCount":2,"tag":"rust"},"__N_SSG":true},"page":"/tags/[tag]","query":{"tag":"rust"},"buildId":"qeoXrASIjfm8hd5j67oMZ","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
